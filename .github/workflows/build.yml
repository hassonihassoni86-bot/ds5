name: Build ds5_controller.prx

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the plugin ELF (OpenOrbis toolchain image)
        run: |
          docker run --rm --user root -w /workspace -v "$PWD":/workspace \
            openorbisofficial/toolchain:latest \
            bash /workspace/ci/build.sh

      - name: Create the PRX
        run: bash ci/make_prx.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds5_controller
          if-no-files-found: warn
          path: |
            bin/*.prx
            bin/*.elf
            ds5_controller.ini.example
            plugins.ini.example
